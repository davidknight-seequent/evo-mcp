[project]
name = "evo-mcp"
version = "0.1.0"
description = "An MCP server implementation using Evo SDK"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cachetools>=5.5.2",
    "fastmcp>=3.2.4",
    "google-adk==1.28.1",
    "evo-files>=0.2.4",
    "evo-compute>=0.0.3",
    "evo-objects>=0.4.3",
    "evo-sdk-common>=0.5.23",
    "evo-schemas>=2025.9.2",
    "evo-widgets>=0.2.0",
    "aiohttp>=3.13.2",
    "aiohttp>=3.13.4",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.1.1",
    "tomli; python_version < '3.11'",
    "pyjwt>=2.11.0",
]

[project.scripts]
evo-mcp = "evo_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pre-commit>=4",
    "ruff==0.15.4",
    "reuse",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["evo_mcp"]
